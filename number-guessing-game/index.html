<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Number-Guessing-Game</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <section class="main-container">
      <h1>Number-Guessing-Game</h1>
      <!-- <p>Guess a Number From 1 to 100</p> -->

      <div class="input-box">
        <label for="guess-number"
          >Guess a number between <strong>1 to 100...</strong>
        </label>
        <input
          type="number"
          id="guess-number"
          placeholder="enter the number that you have guessed.."
        />
      </div>

      <button onclick="guessNum()" id="check-button">check Guess...</button>
      <button onclick="resetGame()" id="reset-button">Reset Game...</button>

      <div class="result">
        <p id="message">start guessing...</p>
        <p>Attempt: <span id="attempt">0</span></p>
      </div>
    </section>
  </body>
</html>
