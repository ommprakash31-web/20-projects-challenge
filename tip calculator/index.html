<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>tip-calculator</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <section class="main-container">
      <h1>Tip-Calculator</h1>

      <div class="input-box">
        <label for="bill-amount">Bill Amount</label>
        <input
          type="number"
          id="bill-amount"
          placeholder="Enter The Bill Amount"
        />
      </div>

      <div class="input-box">
        <label for="tip-percentage">Tip Percentage</label>
        <input
          type="number"
          id="tip-percentage"
          placeholder="Enter The Tip Percentage"
        />
      </div>

      <div class="input-box">
        <label for="number-people">Number of People</label>
        <input
          type="number"
          id="number-people"
          placeholder="Enter The Number Of People"
        />
      </div>

      <button onclick="calculateTip()" id="calculate-btn">Calculate</button>
      <button onclick="resetBtn()" id="reset-btn">Reset</button>

      <div class="result">
        <p>Tip Amount: $ <span id="tip-amount">0.00</span></p>
        <p>Total Amount: $ <span id="total-amount">0.00</span></p>
        <p>Amount per Person: $ <span id="amount-per-person">0.00</span></p>
      </div>
    </section>
  </body>
</html>
