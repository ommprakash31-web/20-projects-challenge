<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Character Counter</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <h1>Character Counter</h1>
    <p>Type something below and count your characters.</p>

    <textarea id="textInput" placeholder="Start typing here..." maxlength="200"></textarea>

    <div class="counter-box">
      <p>Total Characters: <span id="totalChars">0</span></p>
      <p>Remaining Characters: <span id="remainingChars">200</span></p>
    </div>

    <button id="clearBtn">Clear Text</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
